title: Timothy Mwala - Portfolio
description: Professional portfolio showcasing embedded systems and IoT projects
author: Timothy Mwala

# GitHub Pages configuration
plugins:
  - jekyll-sitemap
  - jekyll-feed

# Exclude files from processing
exclude:
  - README.md
  - .github/
  - .gitignore

# Include all HTML, CSS, JS files
include:
  - index.html
  - script.js
  - styles.css
  - 404.html

# Base settings
baseurl: "/Portfolio-"
url: "https://mwalatimothy.github.io"

