name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Create build directory
        run: mkdir -p _site
        
      - name: Copy only production files
        run: |
          # Copy main portfolio files (only what's needed for the website)
          cp index.html _site/
          cp styles.css _site/
          cp script.js _site/
          
          # Create images directory and copy any images that exist
          mkdir -p _site/images
          if [ -d "images" ] && [ "$(ls -A images)" ]; then
            cp images/* _site/images/ 2>/dev/null || true
          fi
          
          # Create a simple robots.txt for SEO
          echo "User-agent: *" > _site/robots.txt
          echo "Allow: /" >> _site/robots.txt
          echo "Sitemap: https://mwalatimothy.github.io/Portfolio-/sitemap.xml" >> _site/robots.txt
          
          # Create a basic sitemap.xml
          cat > _site/sitemap.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://mwalatimothy.github.io/Portfolio-/</loc>
              <lastmod>$(date -u +"%Y-%m-%dT%H:%M:%S+00:00")</lastmod>
              <changefreq>monthly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          EOF
          
          # Add security headers via .htaccess (if Apache) or create _headers for Netlify-style
          cat > _site/_headers << EOF
          /*
            X-Frame-Options: DENY
            X-Content-Type-Options: nosniff
            X-XSS-Protection: 1; mode=block
            Referrer-Policy: strict-origin-when-cross-origin
            Content-Security-Policy: default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https: http:; script-src 'self' 'unsafe-inline'
          EOF
          
          echo "Build completed. Files in _site:"
          ls -la _site/
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4