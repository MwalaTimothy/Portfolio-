name: Deploy Portfolio

on:
  push:
    branches: [ source ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: 📥 Checkout Source Branch
        uses: actions/checkout@v4
        with:
          ref: source
          fetch-depth: 0

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 🏗️ Create Build Directory
        run: |
          mkdir -p _site
          echo "✅ Build directory created"

      - name: 🎨 Process Source Files
        run: |
          # Verify source files exist
          if [ ! -f "index.html" ]; then
            echo "❌ Error: index.html not found"
            exit 1
          fi

          # Copy and clean HTML
          cp index.html _site/index.html
          sed -i '/<!--.*DEV.*-->/d; /<!--.*DEBUG.*-->/d; /<!--.*TODO.*-->/d' _site/index.html

          # Copy and clean CSS
          cp styles.css _site/styles.css
          sed -i '/\/\*.*DEV.*\*\//d; /\/\*.*DEBUG.*\*\//d; /sourceMappingURL/d' _site/styles.css

          # Copy and clean JavaScript
          cp script.js _site/script.js
          sed -i '/console\.log/d; /\/\/.*DEV/d; /\/\/.*DEBUG/d; /debugger;/d' _site/script.js

          echo "✅ Source files processed"

      - name: 📁 Copy Images to Build
        run: |
          if [ -d "images" ]; then
            cp -R images _site/images
            echo "✅ Images copied to build directory"
            echo "📊 Image count: $(find _site/images -type f | wc -l)"
          else
            echo "⚠️ No images directory found"
          fi

      - name: 📝 Generate Production Assets
        run: |
          # 404 Page
          cat > _site/404.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>404 - Timothy Mwala Portfolio</title>
              <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body { 
                      font-family: 'Segoe UI', sans-serif; 
                      background: linear-gradient(135deg, #1e293b 0%, #334155 100%); 
                      color: white; 
                      min-height: 100vh; 
                      display: flex; 
                      align-items: center; 
                      justify-content: center;
                  }
                  .container { text-align: center; padding: 2rem; }
                  h1 { font-size: 4rem; color: #3b82f6; margin-bottom: 1rem; }
                  p { font-size: 1.2rem; margin-bottom: 2rem; opacity: 0.9; }
                  .btn { 
                      display: inline-block; 
                      padding: 12px 24px; 
                      background: #3b82f6; 
                      color: white; 
                      text-decoration: none; 
                      border-radius: 8px; 
                      transition: all 0.3s;
                  }
                  .btn:hover { background: #2563eb; transform: translateY(-2px); }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>404</h1>
                  <p>Page not found. Return to Timothy's Portfolio</p>
                  <a href="/" class="btn">🏠 Portfolio Home</a>
              </div>
          </body>
          </html>
          EOF

          # Robots.txt
          cat > _site/robots.txt << 'EOF'
          User-agent: *
          Allow: /
          Sitemap: https://mwalatimothy.github.io/Portfolio-/sitemap.xml
          EOF

          # Sitemap
          cat > _site/sitemap.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://mwalatimothy.github.io/Portfolio-/</loc>
              <lastmod>$(date -u +%Y-%m-%dT%H:%M:%SZ)</lastmod>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          EOF

          echo "✅ Production assets generated"

      - name: 📊 Verify Build Directory
        run: |
          echo "📂 Build directory contents:"
          echo "=========================="
          echo "Total files: $(find _site -type f | wc -l)"
          echo "HTML files: $(find _site -name "*.html" | wc -l)"
          echo "CSS files: $(find _site -name "*.css" | wc -l)"
          echo "JS files: $(find _site -name "*.js" | wc -l)"
          echo "Image files: $(find _site/images -type f 2>/dev/null | wc -l)"
          echo ""
          echo "🔍 Top-level files in _site:"
          ls -lh _site/ | grep -v "^total" | awk '{print $9, "(" $5 ")"}'

      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📦 Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          retention-days: 7

      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: ✅ Deployment Complete
        run: |
          echo "🎉 Portfolio deployed successfully!"
          echo "🔗 URL: ${{ steps.deployment.outputs.page_url }}"